services:
  db:
    image: pgvector/pgvector:pg16
    container_name: merchantmind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-merchantmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchantmind}
      POSTGRES_DB: ${POSTGRES_DB:-merchantmind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-merchantmind} -d ${POSTGRES_DB:-merchantmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: merchantmind-backend
    restart: unless-stopped
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-merchantmind}:${POSTGRES_PASSWORD:-merchantmind}@db:5432/${POSTGRES_DB:-merchantmind}
      BACKEND_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: merchantmind-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
